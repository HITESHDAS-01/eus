name: Supabase Keep-Alive

on:
  schedule:
    # Har din raat 12 baje run hota hai
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual trigger bhi enable

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Supabase project ko ping kar rahe hai..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/?limit=1")
          
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase project active hai!"
          else
            echo "❌ Supabase ping failed with status: $HTTP_CODE"
            exit 1
          fi
